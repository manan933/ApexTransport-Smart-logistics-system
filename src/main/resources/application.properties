spring.application.name=Apex Transport

# ============================================================
# Database Configuration (PostgreSQL / Environment Variables / Dev Fallback)
# Supports Railway, Render, Neon via SPRING_DATASOURCE_URL or DATABASE_URL
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:apextransport;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Spring Boot auto-selects driver from URL (PostgreSQL or H2)

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true



# ============================================================
# File Upload Configuration
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads

# ============================================================
# Firebase Configuration (Env variables for production)
# ============================================================
firebase.config.path=${FIREBASE_CONFIG_PATH:}
firebase.config.json=${FIREBASE_CONFIG_JSON:}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:}
firebase.project.id=${FIREBASE_PROJECT_ID:apex-transport-demo}
firebase.api.key=${FIREBASE_API_KEY:}
firebase.auth.domain=${FIREBASE_AUTH_DOMAIN:apex-transport-demo.firebaseapp.com}

# ============================================================
# Server & Port (Cloud Platforms inject PORT variable)
# ============================================================
server.port=${PORT:8080}
server.error.path=/error
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true